server {
    listen 80;
    server_name _; # Ganti dengan domain VPS Anda, contoh: go.id

    # Untuk validasi Let's Encrypt / Certbot (jika Anda pakai)
    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/html;
    }

    # Redirect HTTP ke HTTPS (Aktifkan setelah Anda memiliki sertifikat SSL di /etc/letsencrypt)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://web-duampanua:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Keamanan header standar
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Blok HTTPS (Let's Encrypt / Certbot)
# Setelah menjalankan certbot pertama kali, ganti 'domain-anda' dengan domain VPS Anda (contoh: duampanua.pinrangkab.go.id)
server {
    listen 443 ssl;
    server_name smartly-creme-politely.ngrok-free.dev _; # Ganti dengan domain VPS Anda

    # Pengujian Lokal / Self-Signed SSL:
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Pengeluaran Sertifikat Let's Encrypt (Aktifkan jika certbot sudah berjalan untuk domain asli):
    # ssl_certificate /etc/letsencrypt/live/domain-anda/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/domain-anda/privkey.pem;

    location / {
        proxy_pass http://web-duampanua:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Keamanan header standar
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
