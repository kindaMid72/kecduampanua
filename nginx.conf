server {
    listen 80;
    server_name _; # Ganti dengan domain VPS Anda, contoh: go.id

    # Untuk validasi Let's Encrypt / Certbot (jika Anda pakai)
    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/html;
    }

    # Redirect HTTP ke HTTPS (Aktifkan setelah Anda memiliki sertifikat SSL di /etc/letsencrypt)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://web-duampanua:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Keamanan header standar
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

