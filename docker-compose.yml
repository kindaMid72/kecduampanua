services:
  web-duampanua:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-duampanua
    restart: unless-stopped
    # Tidak publish port ke host. Reverse proxy (repo infra) mengakses
    # container ini lewat jaringan eksternal `edge-net`.
    expose:
      - "3000"
    environment:
      # Koneksi ke Supabase (isi nilai ini di environment VPS atau .env)
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY}
    networks:
      - edge-net

networks:
  # Dibuat sekali di server: `docker network create edge-net`
  # Dipakai bersama reverse proxy yang dikelola di repo infra.
  edge-net:
    external: true
